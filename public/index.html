<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureSphere-Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">

        <div class="login-container">

            <div class="logo">
                🔐
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Sign in to continue to your account
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="input-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    Login
                </button>

                <div id="message"></div>

            </form>


            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
